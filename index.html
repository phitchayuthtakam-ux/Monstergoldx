<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#E9F1E4">
<title>MonsterGoldX</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="MonsterGoldX">
<meta name="description" content="โปรแกรมเทรนและควบคุมอาหาร 273 วัน">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 40 40'%3E%3Crect width='40' height='40' fill='%23F7F4EE'/%3E%3Ccircle cx='20' cy='20' r='17' fill='none' stroke='%23A61B18' stroke-width='1.4'/%3E%3Cpath d='M13 13.5 Q20 9 27 13.5' stroke='%23A61B18' stroke-width='1.6' fill='none' stroke-linecap='round'/%3E%3Cpath d='M14.5 17.5 L17 27 M20 16.5 L20 27.5 M25.5 17.5 L23 27' stroke='%23A61B18' stroke-width='1.7' stroke-linecap='round'/%3E%3C/svg%3E">
<style>
      :root{
  --bg:#FFFFFF;
  --mint:#E9F1E4;
  --mint2:#DCE9D4;
  --cream:#FBF5EA;
  --s1:#FFFFFF;
  --s2:#F6F8F5;
  --s3:#EBEFE8;
  --line:#EBEEF3;
  --line2:#D8DEE6;
  --ink:#13294B;
  --ink2:#5B6B85;
  --ink3:#94A0B4;
  --green:#5F7F4F;
  --green-d:#47643A;
  --terra:#C85F35;
  --terra2:#E08A5E;
  --red:#D6302B;
  --gold:#B98A3E;
  --gold-d:#9A6F26;
  --violet:#5F7F4F;
  --violet-d:#47643A;
  --steel:#4E86C4;
  --moss:#3E8F5E;
  --brick:#D6302B;
  --sh:0 2px 14px rgba(19,41,75,.05);
  --sh2:0 10px 30px rgba(19,41,75,.10);
  --r:18px;
  --sans:"Sukhumvit Set","IBM Plex Sans Thai","Noto Sans Thai","Leelawadee UI",Tahoma,-apple-system,sans-serif;
  --serif:Georgia,"Times New Roman",serif;
  --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.5;
  padding-bottom:calc(72px + env(safe-area-inset-bottom));
}
button{font-family:inherit;font-size:inherit;color:inherit;border:0;background:none;cursor:pointer}
input{font-family:inherit;font-size:inherit;color:inherit}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums}

/* ---------- header ---------- */
header{position:sticky;top:0;z-index:20;backdrop-filter:blur(14px);
  background:rgba(255,255,255,.95);border-bottom:1px solid var(--line);padding:11px 18px 10px}
.brand{display:flex;align-items:center;gap:10px}
.brand svg{flex:0 0 34px}
.brand .w{font-weight:800;font-size:15px;letter-spacing:.14em;line-height:1;color:var(--ink)}
.brand .w i{font-style:normal;color:var(--terra)}
.brand .rt b{color:var(--ink)}
.brand .tag{font-size:8.5px;color:var(--ink3);letter-spacing:.2em;margin-top:5px;font-weight:500}
.brand .rt{margin-left:auto;text-align:right}
.brand .rt b{display:block;font-size:13px;font-weight:600}
.brand .rt span{display:block;font-size:10.5px;color:var(--ink3)}
.track{margin-top:12px;height:2px;background:var(--s3);position:relative;overflow:hidden}
.track i{position:absolute;inset:0 auto 0 0;background:var(--terra)}
.track u{position:absolute;top:0;bottom:0;width:1px;background:var(--bg)}

/* ---------- shell ---------- */
main{padding:20px 18px 30px;max-width:660px;margin:0 auto}
.view{display:none}.view.on{display:block}
h2{font-size:15px;font-weight:600;color:var(--ink);margin:32px 0 13px;letter-spacing:.01em;font-family:var(--serif)}
h2:first-child{margin-top:2px}
.card{background:var(--s1);border:1px solid var(--line);border-radius:var(--r);padding:18px}
.card+.card{margin-top:11px}

/* ---------- hero ---------- */
.hero{border-radius:16px;padding:24px 22px;background:var(--ink);border:0;position:relative;overflow:hidden;color:#F7F4EE}
.hero:before{content:"";position:absolute;right:-86px;top:-86px;width:230px;height:230px;border-radius:50%;
  border:1px solid rgba(247,244,238,.16)}
.hero:after{content:"";position:absolute;right:-46px;top:-46px;width:150px;height:150px;border-radius:50%;
  border:1px solid rgba(166,27,24,.55)}
.hero .kick{font-size:9.5px;letter-spacing:.22em;color:#B9AF9E;font-weight:500;text-transform:uppercase}
.hero h1{margin:9px 0 0;font-size:23px;font-weight:600;line-height:1.3;letter-spacing:.005em;position:relative;font-family:var(--serif)}
.hero .sub{margin-top:9px;font-size:13px;color:#B9AF9E;position:relative;font-weight:400}
.hero .row{display:flex;align-items:center;gap:14px;margin-top:15px;position:relative}
.ring{flex:0 0 62px}
.go{display:block;width:100%;flex:1;padding:15px;border-radius:99px;text-align:center;font-weight:600;
  background:var(--green);color:#fff;letter-spacing:.02em;font-size:14.5px}
.go.ghost{background:transparent;color:var(--ink);border:1px solid var(--line2);font-weight:600}
.note{background:#FDF1EC;border:1px solid #F6DCD1;border-left:3px solid var(--terra);border-radius:0 14px 14px 0;
  padding:14px 16px;font-size:13.5px;margin-top:11px;color:#8F3D1A;line-height:1.6}
.note.gold{background:var(--cream);border-color:#EFE4CE;border-left-color:var(--gold);color:#7A5A1E}

/* ---------- checklist ---------- */
.chk{display:flex;align-items:center;gap:13px;padding:13px 0;border-bottom:1px solid var(--line)}
.chk:last-child{border-bottom:0}
.box{flex:0 0 24px;height:24px;border:1px solid var(--line2);border-radius:50%;position:relative;transition:.15s;background:transparent}
.done .box{background:var(--moss);border-color:var(--moss)}
.done .box:after{content:"";position:absolute;left:8px;top:4px;width:5px;height:11px;
  border:solid #fff;border-width:0 2px 2px 0;transform:rotate(42deg)}
.chk .t{flex:1;min-width:0}
.chk .t b{display:block;font-weight:600;font-size:14.5px}
.chk .t span{display:block;font-size:12.5px;color:var(--ink2);margin-top:1px}
.done .t b{color:var(--ink3);text-decoration:line-through}

/* ---------- stats ---------- */
.stats{display:grid;grid-auto-flow:column;gap:8px}
.stats div{background:transparent;border:1px solid var(--line);border-radius:12px;padding:14px 5px;text-align:center}
.stats b{display:block;font-family:var(--serif);font-size:22px;font-weight:600;letter-spacing:0}
.stats span{display:block;font-size:9.5px;color:var(--ink3);margin-top:5px;letter-spacing:.08em}
.stats div.hi{background:var(--cream);border-color:#EFE4CE}
.stats div.hi b{color:var(--terra)}

.water{display:flex;gap:5px;margin-top:11px}
.water b{flex:1;height:36px;border:1px solid var(--line2);border-radius:6px;background:transparent;transition:.15s}
.water b.on{background:var(--steel);border-color:var(--steel)}

/* ---------- exercise ---------- */
.ex{border-bottom:1px solid var(--line);padding:14px 0}
.ex:last-child{border-bottom:0}
.ex-top{display:flex;gap:12px;align-items:flex-start}
.fig{flex:0 0 84px;height:66px;background:var(--mint);border:0;border-radius:14px;padding:5px}
.fig svg{width:100%;height:100%;display:block}
.ex-i{flex:1;min-width:0}
.ex-i b{display:block;font-weight:600;font-size:15px;line-height:1.35;font-family:var(--serif)}
.ex-i .sr{display:inline-block;margin-top:6px;font-family:var(--mono);font-size:11.5px;color:var(--green-d);
  background:var(--mint);border:0;border-radius:99px;padding:4px 11px;font-weight:700}
.ex-i .mt{display:inline-block;margin:5px 0 0 5px;font-family:var(--mono);font-size:11.5px;color:var(--ink3)}
.ex-tip{font-size:12.5px;color:var(--ink2);margin-top:8px;line-height:1.45}
.sets{display:flex;flex-wrap:wrap;gap:6px;margin-top:11px}
.set{display:flex;align-items:center;gap:2px;background:transparent;border:1px solid var(--line2);
  border-radius:10px;padding:6px 6px 6px 9px}
.set input{width:40px;border:0;background:transparent;text-align:center;font-family:var(--mono);font-size:13.5px;padding:2px 0}
.set input:focus{outline:2px solid var(--green);outline-offset:2px;border-radius:4px}
.set .x{color:var(--ink3);font-size:11px}
.set .rm{color:var(--brick);padding:0 3px;font-size:16px;line-height:1}
.addset{border:1px dashed var(--line2);border-radius:99px;padding:7px 15px;font-size:12.5px;color:var(--green-d);font-weight:700;background:var(--s2)}
.last{font-size:11.5px;color:var(--ink3);margin-top:8px;font-family:var(--mono)}
.rests{display:flex;gap:6px;margin-top:12px}
.rests button{flex:1;border:1px solid var(--line2);border-radius:99px;padding:10px 0;font-size:12px;background:transparent;color:var(--ink2)}

/* ---------- timer ---------- */
.timer{position:fixed;left:14px;right:14px;bottom:calc(78px + env(safe-area-inset-bottom));
  background:var(--s1);border:1px solid var(--line2);border-radius:14px;
  padding:13px 16px;display:none;align-items:center;gap:14px;z-index:25;box-shadow:var(--sh2)}
.timer.on{display:flex}
.timer .n{font-family:var(--mono);font-size:26px;font-weight:800;color:var(--terra);letter-spacing:-.02em}
.timer .p{flex:1;height:4px;background:var(--s3);border-radius:99px;position:relative;overflow:hidden}
.timer .p i{position:absolute;inset:0 auto 0 0;background:var(--terra);border-radius:99px}
.timer button{color:var(--ink3);font-size:13px}

/* ---------- meals ---------- */
.meal{display:flex;gap:12px;padding:13px 0;border-bottom:1px solid var(--line);align-items:flex-start}
.meal:last-child{border-bottom:0}
.meal .tm{flex:0 0 50px;font-family:var(--mono);font-size:12px;color:var(--terra);padding-top:4px;font-weight:700}
.meal .bd{flex:1;min-width:0}
.meal .bd b{display:block;font-weight:600;font-size:14.5px;font-family:var(--serif)}
.meal .bd span{display:block;font-size:13px;color:var(--ink2);margin-top:3px;line-height:1.45}
.meal .bd em{display:block;font-style:normal;font-size:11px;color:var(--ink3);margin-top:5px;font-family:var(--mono)}
.meal.done .bd b{color:var(--ink3)}
.mbar{height:4px;background:var(--s3);border-radius:99px;position:relative;overflow:hidden;margin-top:6px}
.mbar i{position:absolute;inset:0 auto 0 0;background:var(--green);border-radius:99px}
.tags{display:flex;flex-wrap:wrap;gap:6px}
.tag{font-size:12px;padding:7px 13px;border-radius:99px;background:var(--mint);border:0;color:var(--green-d);font-weight:600}
.tag.no{background:#FDF1EC;border-color:#F6DCD1;color:#B8501F}

/* ---------- weigh ---------- */
.bigin{display:flex;gap:9px;margin-top:9px}
.bigin input{flex:1;border:1px solid var(--line2);background:transparent;border-radius:12px;padding:15px;
  font-family:var(--serif);font-size:28px;text-align:center;font-weight:600}
.bigin button{background:var(--green);color:#fff;border-radius:99px;padding:0 24px;font-weight:700}
svg.chart{width:100%;height:180px;display:block}
table{width:100%;border-collapse:separate;border-spacing:0;font-size:13px}
th,td{padding:9px 6px;text-align:center;border-bottom:1px solid var(--line)}
th{color:var(--ink3);font-weight:500;font-size:10px;letter-spacing:.1em;text-transform:uppercase}
td.l{text-align:left}
tr:last-child td{border-bottom:0}
tr.hit td:last-child{color:var(--moss);font-weight:600}
tr.miss td:last-child{color:var(--brick);font-weight:700}
.mz label{font-size:11.5px;color:var(--ink3);display:block;margin-bottom:5px}
.mz input{width:100%;border:1px solid var(--line);background:var(--s2);border-radius:13px;padding:12px;
  font-family:var(--mono);text-align:center;font-size:15px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:4px}

/* ---------- plan ---------- */
.dnav{display:flex;gap:8px;align-items:center;margin-bottom:12px}
.dnav button{border:1px solid var(--line);background:var(--s2);border-radius:50%;width:44px;height:44px;padding:0;color:var(--green-d);font-size:17px;line-height:1}
.dnav div{flex:1;border:0;background:transparent;padding:11px;text-align:center;font-size:14px;font-weight:600;font-family:var(--serif)}
.rule{display:flex;gap:10px;padding:11px 0;border-bottom:1px solid var(--line);font-size:13.5px;align-items:flex-start}
.rule:last-child{border-bottom:0}
.rule s{text-decoration:none;flex:0 0 54px;font-size:10px;font-weight:700;text-align:center;
  padding:4px 0;border-radius:99px;background:#FDF1EC;color:#B8501F;margin-top:1px}
.rule.g s{background:var(--mint);color:var(--green-d)}
.rule span{flex:1}

/* ---------- nav ---------- */
nav{position:fixed;left:0;right:0;bottom:0;z-index:30;display:flex;
  background:rgba(255,255,255,.97);backdrop-filter:blur(14px);border-top:1px solid var(--line);
  padding-bottom:env(safe-area-inset-bottom)}
nav button{flex:1;padding:11px 2px 10px;color:var(--ink3);font-size:10px;text-align:center;position:relative;font-weight:500}
nav button svg{display:block;margin:0 auto 3px;width:21px;height:21px}
nav button.on{color:var(--ink)}
nav button.on:before{content:"";position:absolute;top:0;left:50%;transform:translateX(-50%);width:22px;height:2.5px;background:var(--terra);border-radius:99px}





/* ---------- แบนเนอร์ลายพื้นหลัง ---------- */
.banner{margin:-20px -18px 0;padding:22px 18px 62px;position:relative;overflow:hidden;
  background:var(--mint);background-image:
   radial-gradient(circle at 12% 22%,rgba(255,255,255,.9) 9px,transparent 10px),
   radial-gradient(circle at 78% 14%,rgba(255,255,255,.75) 6px,transparent 7px),
   radial-gradient(circle at 44% 58%,rgba(255,255,255,.55) 12px,transparent 13px),
   radial-gradient(circle at 90% 70%,rgba(255,255,255,.8) 8px,transparent 9px),
   radial-gradient(circle at 25% 84%,rgba(255,255,255,.6) 10px,transparent 11px),
   radial-gradient(circle at 62% 32%,rgba(255,255,255,.45) 5px,transparent 6px)}
.banner .bn{position:relative;text-align:center}
.banner .bn em{display:block;font-style:normal;font-size:11px;letter-spacing:.2em;color:var(--green-d);font-weight:600}
.banner .bn h1{margin:9px 0 0;font-family:var(--serif);font-size:30px;font-weight:600;color:var(--green-d);letter-spacing:-.01em;line-height:1.15}
.banner .bn p{margin:9px 0 0;font-size:13px;color:var(--green-d);opacity:.85}
.banner .bn .cd{display:inline-flex;align-items:baseline;gap:7px;margin-top:14px;background:rgba(255,255,255,.75);
  border-radius:99px;padding:8px 18px}
.banner .bn .cd b{font-family:var(--serif);font-size:27px;font-weight:600;color:var(--terra)}
.banner .bn .cd span{font-size:11.5px;color:var(--green-d);font-weight:600}

/* ---------- การ์ดขาวลอยทับแบนเนอร์ ---------- */
.sheet{background:#fff;border-radius:22px;box-shadow:var(--sh);margin:-46px 0 0;padding:18px;position:relative;z-index:2}
.hi-row{display:flex;align-items:center;justify-content:space-between;gap:12px}
.hi-row .nm{font-size:19px;font-weight:800;color:var(--ink);letter-spacing:-.01em}
.hi-row .bg{display:inline-flex;align-items:center;gap:5px;background:linear-gradient(90deg,#F6D5C4,#F3C3AB);
  border-radius:99px;padding:5px 13px;font-size:11.5px;font-weight:700;color:#9C4520;margin-top:6px}
.hi-row .av{flex:0 0 52px;height:52px;border-radius:50%;background:var(--red);display:flex;align-items:center;justify-content:center}
.hi-row .av svg{width:32px;height:32px}
.kpi{display:flex;gap:26px;margin-top:14px}
.kpi div b{display:block;font-size:23px;font-weight:800;color:var(--ink);font-family:var(--mono);letter-spacing:-.02em}
.kpi div span{display:block;font-size:10.5px;color:var(--ink3);letter-spacing:.09em;margin-top:2px;font-weight:600}

/* ---------- ปุ่มใหญ่สองช่องมีภาพ ---------- */
.duo{display:flex;align-items:stretch;margin-top:20px}
.duo > button{flex:1;background:none;padding:6px 4px;text-align:center;position:relative}
.duo .sep{flex:0 0 1px;background:var(--line);margin:10px 0}
.blob{width:118px;height:88px;margin:0 auto;border-radius:50%/46%;display:flex;align-items:center;justify-content:center;
  background:var(--mint);position:relative}
.blob svg{width:92px;height:70px}
.duo b{display:block;margin-top:11px;font-size:16px;font-weight:800;letter-spacing:.02em;color:var(--green-d)}
.duo span{display:block;font-size:11.5px;color:var(--ink3);margin-top:4px;font-weight:600}
.duo .tagr{position:absolute;top:0;right:4px;background:var(--mint2);color:var(--green-d);
  font-size:10px;font-weight:700;padding:4px 10px;border-radius:99px}
.duo .tagr.ok{background:#E2F3E8;color:#2C7A4C}

/* ---------- แถวไอคอนเส้นบาง 4 ช่อง ---------- */
.quick{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;margin-top:18px;padding-top:18px;border-top:1px solid var(--line)}
.quick button{padding:4px 2px;text-align:center;position:relative}
.quick i{display:block;color:var(--green);margin-bottom:8px}
.quick i svg{width:27px;height:27px;margin:0 auto}
.quick b{display:block;font-size:11.5px;font-weight:600;color:var(--ink2);line-height:1.35}
.quick .dot{position:absolute;top:-2px;right:12px;width:7px;height:7px;border-radius:50%;background:var(--moss)}

/* ---------- การ์ดเลเวลไล่สี ---------- */
.lvl{border-radius:20px;overflow:hidden;background:linear-gradient(130deg,#D47548,#C85F35 62%,#B85028);
  padding:20px 18px 0;position:relative;margin-top:22px;box-shadow:0 8px 22px rgba(200,95,53,.22)}
.lvl:before{content:"";position:absolute;right:-40px;top:-30px;width:190px;height:190px;border-radius:50%;background:rgba(255,255,255,.08)}
.lvl h3{margin:0;font-family:var(--serif);font-size:26px;font-weight:600;color:#FFF3EA;position:relative}
.lvl p{margin:7px 0 0;font-size:13px;color:rgba(255,243,234,.9);position:relative}
.lvl .pr{display:flex;align-items:center;gap:11px;margin-top:13px;position:relative}
.lvl .pr .bar{flex:1;height:7px;background:rgba(255,255,255,.35);border-radius:99px;overflow:hidden}
.lvl .pr .bar i{display:block;height:100%;background:#5A2A12;border-radius:99px}
.lvl .pr b{font-size:13px;color:#FFF3EA;font-family:var(--mono);font-weight:700}
.lvl .inner{background:#fff;border-radius:16px;margin-top:17px;padding:14px;position:relative}
.lvl .inner .hd{font-size:14px;font-weight:800;color:var(--ink);margin-bottom:12px}
.lvl .inner .row4{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;text-align:center}
.lvl .inner .row4 b{display:block;font-family:var(--mono);font-size:17px;font-weight:800;color:var(--ink)}
.lvl .inner .row4 span{display:block;font-size:10.5px;color:var(--ink3);margin-top:3px;font-weight:600}
.lvl .pad{height:16px}

/* ---------- การ์ดครีม 2 ช่อง ---------- */
.ccards{display:grid;grid-template-columns:1fr 1fr;gap:11px}
.ccard{background:var(--cream);border-radius:16px;padding:16px;min-height:104px;display:flex;flex-direction:column;justify-content:space-between}
.ccard .t{display:flex;align-items:flex-start;justify-content:space-between;gap:8px}
.ccard .t span{font-size:12.5px;font-weight:700;color:var(--ink);letter-spacing:.02em}
.ccard .t i{color:var(--gold);flex:0 0 auto}
.ccard .t i svg{width:19px;height:19px;display:block}
.ccard b{font-family:var(--mono);font-size:25px;font-weight:800;color:var(--ink);letter-spacing:-.02em}
.ccard em{font-style:normal;font-size:11px;color:var(--ink3);font-weight:600;display:block;margin-top:2px}
.secthd{font-size:16px;font-weight:800;color:var(--ink);letter-spacing:.04em;margin:26px 0 12px}
.secthd span{display:block;font-size:10px;font-weight:600;color:var(--ink3);letter-spacing:.16em;margin-top:3px}


/* ---------- หน้าตั้งค่าเริ่มต้น ---------- */
.ob{padding:4px 0 10px}
.ob .obh{text-align:center;padding:18px 6px 22px}
.ob .obh em{display:block;font-style:normal;font-size:10.5px;letter-spacing:.2em;color:var(--green-d);font-weight:700}
.ob .obh h1{margin:11px 0 0;font-family:var(--serif);font-size:27px;font-weight:600;color:var(--ink);line-height:1.25}
.ob .obh p{margin:11px 0 0;font-size:13.5px;color:var(--ink2);line-height:1.6}
.obs{background:var(--s1);border:1px solid var(--line);border-radius:18px;padding:17px;margin-bottom:11px;display:flex;gap:13px}
.obs.done{background:#F6FAF7;border-color:#CCE6D6}
.obs .n{flex:0 0 30px;height:30px;border-radius:50%;border:1px solid var(--line2);display:flex;align-items:center;justify-content:center;

.obs.done .n{background:var(--moss);border-color:var(--moss);color:#fff}
.obs .bd{flex:1;min-width:0}
.obs .bd b{display:block;font-size:15.5px;font-weight:800;color:var(--ink)}
.obs .bd span{display:block;font-size:12.5px;color:var(--ink2);margin-top:6px;line-height:1.55}
.obs .bd .warn{color:#B8501F;font-weight:600}
/* ---------- คลังอาหารที่กินบ่อย ---------- */
.favs{display:flex;flex-wrap:wrap;gap:7px;margin-top:11px}
.fav{display:inline-flex;align-items:center;gap:7px;background:var(--mint);border:0;border-radius:99px;
  padding:8px 13px;font-size:12.5px;color:var(--green-d);font-weight:600}
.fav s{text-decoration:none;font-family:var(--mono);font-size:11px;opacity:.75}
.favttl{font-size:11.5px;color:var(--ink3);font-weight:700;margin-top:13px;letter-spacing:.04em}
/* ---------- ไดอารี่อาหาร ---------- */
.kcalcard{background:var(--s1);border:1px solid var(--line);border-radius:18px;padding:18px}
.kcalcard .top{display:flex;align-items:baseline;justify-content:space-between}
.kcalcard .big{font-size:30px;font-weight:800;color:var(--ink);letter-spacing:-.02em;font-family:var(--mono)}
.kcalcard .big s{text-decoration:none;font-size:15px;color:var(--ink3);font-weight:600}
.kcalcard .left{text-align:right}
.kcalcard .left b{display:block;font-size:24px;font-weight:800;font-family:var(--mono);color:var(--green-d);letter-spacing:-.02em}
.kcalcard .left span{font-size:11px;color:var(--ink3);font-weight:600}
.kcalcard .over b{color:var(--terra)}
.kbar{height:9px;background:var(--s3);border-radius:99px;overflow:hidden;margin-top:13px}
.kbar i{display:block;height:100%;background:var(--green);border-radius:99px;transition:width .3s}
.kbar.over i{background:var(--terra)}
.m3{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-top:16px;padding-top:16px;border-top:1px solid var(--line)}
.m3 .lab{font-size:12.5px;font-weight:700;color:var(--ink)}
.m3 .v{font-size:14px;font-weight:800;color:var(--ink);font-family:var(--mono);margin-top:3px}
.m3 .v s{text-decoration:none;font-size:11.5px;color:var(--ink3);font-weight:600}
.m3 .b{height:5px;background:var(--s3);border-radius:99px;overflow:hidden;margin-top:7px}
.m3 .b i{display:block;height:100%;border-radius:99px}
.mealrow{background:var(--s1);border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:10px}
.mealrow .hd{display:flex;align-items:center;gap:11px}
.mealrow .hd i{flex:0 0 34px;height:34px;border-radius:11px;background:var(--mint);color:var(--green-d);display:flex;align-items:center;justify-content:center}
.mealrow .hd i svg{width:18px;height:18px}
.mealrow .hd .nm{flex:1;min-width:0}
.mealrow .hd .nm b{display:block;font-size:14.5px;font-weight:800;color:var(--ink)}
.mealrow .hd .nm span{display:block;font-size:11.5px;color:var(--ink3);font-weight:600;margin-top:2px}
.mealrow .hd .kc{font-family:var(--mono);font-size:14px;font-weight:800;color:var(--ink)}
.mealrow .plan{font-size:12.5px;color:var(--ink2);margin-top:10px;line-height:1.5;background:var(--s2);border-radius:11px;padding:10px 12px}
.mealrow .items{margin-top:9px}
.fitem{display:flex;align-items:center;gap:9px;padding:8px 0;border-top:1px solid var(--line)}
.fitem .n{flex:1;min-width:0;font-size:13px;color:var(--ink)}
.fitem .n em{display:block;font-style:normal;font-size:10.5px;color:var(--ink3);font-family:var(--mono);margin-top:2px}
.fitem .k{font-family:var(--mono);font-size:13px;font-weight:700;color:var(--ink)}
.fitem .x{color:var(--ink3);font-size:17px;padding:0 3px;line-height:1}
.mbtns{display:flex;gap:8px;margin-top:11px}
.mbtns button{flex:1;border-radius:99px;padding:10px 0;font-size:12.5px;font-weight:700}
.mbtns .pri{background:var(--green);color:#fff}
.mbtns .sec{background:var(--s2);color:var(--ink2);border:1px solid var(--line)}
.addfood{margin-top:11px;background:var(--s2);border-radius:13px;padding:13px}
.addfood input{width:100%;border:1px solid var(--line2);background:#fff;border-radius:10px;padding:10px;font-size:14px;margin-bottom:8px}
.addfood .r4{display:grid;grid-template-columns:repeat(4,1fr);gap:7px}
.addfood .r4 input{margin-bottom:0;text-align:center;font-family:var(--mono);padding:9px 4px}
.addfood label{font-size:10.5px;color:var(--ink3);font-weight:600;display:block;margin-bottom:4px;text-align:center}
/* ---------- แบนเนอร์เตือน ---------- */
.alert{border-radius:18px;padding:16px 17px;margin-top:20px;border:1px solid #F6DCD1;background:#FDF1EC}
.alert.ok{border-color:#CCE6D6;background:#EDF6F0}
.alert .ah{display:flex;align-items:center;gap:10px;font-size:14.5px;font-weight:800;color:#B8501F}
.alert.ok .ah{color:#2C7A4C}
.alert .ah svg{width:20px;height:20px;flex:0 0 20px}
.alert ul{margin:11px 0 0;padding:0;list-style:none}
.alert li{display:flex;align-items:center;gap:10px;padding:9px 0;border-top:1px solid rgba(184,80,31,.14);font-size:13px;color:#8F3D1A}
.alert li b{flex:1;font-weight:600}
.alert li button{background:#fff;border:1px solid #F0CDBC;color:#B8501F;border-radius:99px;padding:6px 14px;font-size:12px;font-weight:700}
.alert .sub{font-size:12px;margin-top:9px;color:#2C7A4C}
/* ---------- การ์ดคาร์ดิโอ ---------- */
.cardio{background:var(--s1);border:1px solid var(--line);border-radius:18px;padding:16px;margin-bottom:12px}
.cardio .ch{display:flex;align-items:center;gap:11px}
.cardio .ch i{flex:0 0 40px;height:40px;border-radius:13px;background:var(--mint);color:var(--green-d);display:flex;align-items:center;justify-content:center}
.cardio .ch i svg{width:21px;height:21px}
.cardio .ch .t{flex:1}
.cardio .ch .t b{display:block;font-size:15px;font-weight:800;color:var(--ink)}
.cardio .ch .t span{display:block;font-size:11.5px;color:var(--ink3);font-weight:600;margin-top:2px}
.cardio .ch .mn{font-family:var(--mono);font-size:19px;font-weight:800;color:var(--green-d)}
.cardio dl{margin:13px 0 0;display:grid;grid-template-columns:auto 1fr;gap:7px 12px;font-size:12.5px}
.cardio dt{color:var(--ink3);font-weight:700;white-space:nowrap}
.cardio dd{margin:0;color:var(--ink2);line-height:1.5}
.cardio .alt{margin-top:11px;background:var(--s2);border-radius:11px;padding:10px 12px;font-size:12.5px;color:var(--ink2);line-height:1.5}
.cdone{display:flex;gap:8px;margin-top:12px;align-items:center}
.cdone input{width:74px;border:1px solid var(--line2);background:#fff;border-radius:10px;padding:10px;font-family:var(--mono);text-align:center;font-size:15px}
.cdone button{flex:1;border-radius:99px;padding:11px;font-size:13px;font-weight:700;background:var(--green);color:#fff}
.cdone button.done{background:#EDF6F0;color:#2C7A4C;border:1px solid #CCE6D6}
/* ---------- สเต็ป ---------- */
.step{display:flex;gap:15px;background:var(--s1);border:1px solid var(--line);border-radius:14px;padding:18px;margin-bottom:10px;position:relative}
.step.ok{border-color:var(--line);background:var(--s2)}
.step .no{flex:0 0 30px;height:30px;border-radius:50%;background:transparent;color:var(--ink3);
  border:1px solid var(--line2);display:flex;align-items:center;justify-content:center;font-weight:500;font-size:13px;font-family:var(--serif)}
.step.ok .no{background:var(--ink);color:#F7F4EE;border-color:var(--ink)}
.step.now .no{background:var(--green);color:#fff;border-color:var(--green)}
.step .bd{flex:1;min-width:0}
.step .bd b{display:block;font-size:16px;font-weight:600;letter-spacing:.005em;font-family:var(--serif)}
.step .bd .en{display:block;font-size:9.5px;color:var(--ink3);font-weight:500;margin-top:3px;letter-spacing:.16em;text-transform:uppercase}
.step .bd .ds{display:block;font-size:13px;color:var(--ink2);margin-top:7px;line-height:1.5}
.step .act{margin-top:11px}
.step .req{position:absolute;top:17px;right:17px;font-size:8.5px;font-weight:600;letter-spacing:.14em;
  padding:4px 10px;border-radius:99px;border:1px solid var(--terra);color:var(--terra);text-transform:uppercase}
.step .req.opt{border-color:var(--line2);color:var(--ink3)}
h2 .en{display:block;font-size:9.5px;font-weight:500;color:var(--ink3);letter-spacing:.18em;margin-top:4px;text-transform:uppercase}
.tile em{display:block;font-style:normal;font-size:8.5px;color:var(--ink3);font-weight:500;margin-top:2px;letter-spacing:.14em;text-transform:uppercase}
nav button em{display:block;font-style:normal;font-size:7.5px;opacity:.65;letter-spacing:.14em;text-transform:uppercase;margin-top:1px}
.dataq{display:flex;gap:9px;align-items:center;background:var(--s2);border:1px solid var(--line);border-radius:14px;padding:14px 16px;font-size:12.5px;color:var(--ink2);line-height:1.6;margin-top:11px}
.miss{color:var(--ink3);font-weight:600}
/* ---------- เมนูไอคอน ---------- */
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:0;background:var(--s1);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.tile{background:transparent;border:0;border-right:1px solid var(--line);border-bottom:1px solid var(--line);
  padding:18px 6px 16px;text-align:center;position:relative;transition:background .12s}
.tile:nth-child(3n){border-right:0}
.tile:nth-child(n+4){border-bottom:0}
.tile:active{background:var(--s2)}
.tile i{display:flex;align-items:center;justify-content:center;width:38px;height:38px;margin:0 auto 10px;
  border-radius:50%;border:1px solid var(--line2);color:var(--red)}
.tile i svg{width:19px;height:19px}
.tile b{display:block;font-size:12.5px;font-weight:600;color:var(--ink)}
.tile span{display:block;font-size:10.5px;color:var(--ink3);margin-top:4px;font-weight:400}
.tile.ok i{border-color:var(--red);background:var(--red);color:#FFFDFA}
.c1,.c2,.c3,.c4,.c5,.c6{background:transparent}
.greet{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
.greet b{display:block;font-size:21px;font-weight:600;letter-spacing:.005em;font-family:var(--serif)}
.greet span{display:block;font-size:11px;color:var(--ink3);margin-top:4px;font-weight:400;letter-spacing:.06em}
.prog{display:flex;align-items:center;gap:13px}
.prog .pbar{flex:1;height:3px;background:var(--s3);overflow:hidden}
.prog .pbar i{display:block;height:100%;background:var(--red);transition:width .3s}
.prog b{font-family:var(--mono);font-size:16px;font-weight:800}
/* ---------- ชั้นการกรอก ---------- */
.lab{display:inline-flex;align-items:center;gap:6px;font-size:10.5px;font-weight:800;letter-spacing:.09em;padding:5px 12px;border-radius:99px;margin-bottom:9px}
.lab.must{background:var(--terra);color:#fff}
.lab.opt{background:var(--s2);color:var(--ink3);border:1px solid var(--line)}
.bigbtn{display:block;width:100%;padding:17px;border-radius:99px;font-weight:600;font-size:15px;
  background:var(--green);color:#fff;box-shadow:0 6px 16px rgba(95,127,79,.28);border-radius:99px;font-weight:700;font-size:15px}
.bigbtn.done{background:#EDF6F0;color:#2C7A4C;border:1px solid #CCE6D6;box-shadow:none}
.bigbtn:active{transform:scale(.985)}
details{margin-top:11px}
summary{list-style:none;cursor:pointer;display:flex;align-items:center;justify-content:space-between;gap:10px;
  padding:16px 18px;background:var(--s1);border:1px solid var(--line);border-radius:14px;font-size:13px;color:var(--ink2);font-weight:600}
summary::-webkit-details-marker{display:none}
summary:after{content:"＋";color:var(--green);font-size:15px;font-weight:600}
details[open] summary{border-radius:14px 14px 0 0;border-bottom:0}
details[open] summary:after{content:"－"}
details>.card{border-radius:0 0 14px 14px;margin-top:0;border-top:0}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.two .mini{background:var(--s1);border:1px solid var(--line);border-radius:14px;padding:16px}
.two .mini span{display:block;font-size:9.5px;color:var(--ink3);font-weight:500;letter-spacing:.12em;text-transform:uppercase}
.two .mini b{display:block;font-family:var(--serif);font-size:30px;font-weight:600;letter-spacing:0;margin-top:6px}
.hrow{display:flex;align-items:center;justify-content:space-between;gap:12px;position:relative}
.days{display:flex;align-items:baseline;gap:7px;margin-top:2px}
.days b{font-family:var(--serif);font-size:56px;font-weight:600;letter-spacing:-.02em;line-height:1;color:#F7F4EE}
.days span{font-size:11px;color:#B9AF9E;font-weight:500;letter-spacing:.1em}
.sesh{margin-top:20px;padding-top:18px;border-top:1px solid rgba(247,244,238,.16);position:relative}
.sesh .st{font-size:9.5px;letter-spacing:.18em;color:#B9AF9E;font-weight:500;text-transform:uppercase}
.pillrow{display:flex;gap:7px;flex-wrap:wrap;margin-top:10px}
.pill{font-size:11.5px;font-weight:500;padding:6px 13px;border-radius:99px;background:transparent;border:1px solid var(--line2);color:var(--ink3)}
.pill.on{background:#EDF6F0;border-color:#CCE6D6;color:#2C7A4C;font-weight:600}
.empty{color:var(--ink3);font-size:13.5px;padding:24px 0;text-align:center}
.saved{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(88px + env(safe-area-inset-bottom));
  background:var(--ink);color:#F7F4EE;padding:9px 16px;border-radius:99px;font-size:13px;font-weight:700;
  opacity:0;transition:opacity .2s;pointer-events:none;z-index:40}
.saved.on{opacity:1}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>

<header>
  <div class="brand">
    <svg viewBox="0 0 40 40" fill="none" aria-hidden="true">
      <circle cx="20" cy="20" r="18.5" stroke="#A61B18" stroke-width="1.2"/>
      <circle cx="20" cy="20" r="15" stroke="#A61B18" stroke-width="0.6" opacity=".45"/>
      <path d="M13 13.5 Q20 9 27 13.5" stroke="#A61B18" stroke-width="1.4" stroke-linecap="round"/>
      <path d="M14.5 17.5 L17 27 M20 16.5 L20 27.5 M25.5 17.5 L23 27" stroke="#A61B18" stroke-width="1.5" stroke-linecap="round"/>
      <circle cx="20" cy="31" r="1.6" fill="#A61B18"/>

<main>
  <section class="view on" id="v-today"></section>
  <section class="view" id="v-lift"></section>
  <section class="view" id="v-eat"></section>
  <section class="view" id="v-weigh"></section>
  <section class="view" id="v-plan"></section>
</main>

<div class="timer" id="timer">

</div>

  <button class="on" data-v="today"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10.5 12 3l9 7.5"/><path d="M5.5 9.5V20h13V9.5"/><path d="M9.5 20v-5.5h5V20"/></svg>วันนี้<em>Today</em></button>

<script>
/* =====================================================================
   ภาพประกอบท่า — วาดเป็น SVG ในตัวแอป ไม่ต้องโหลดจากอินเทอร์เน็ต
   ===================================================================== */
const G="#C85F35", I="#7C8A9C";
function fig(inner){
  return `<svg viewBox="0 0 120 92" fill="none" stroke="${I}" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">${inner}</svg>`;
}
const AR=(d)=>`<path d="${d}" stroke="${G}" stroke-width="2.4" marker-end="url(#ah)"/>`;
const DEFS=`<defs><marker id="ah" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="${G}"/></marker></defs>`;
const H=(x,y,r)=>`<circle cx="${x}" cy="${y}" r="${r||6}"/>`;

const FIGS={
pulldown:fig(DEFS+`<path d="M22 22h58M52 22v-8"/>${H(52,46)}<path d="M52 52v16M52 68l-9 12M52 68l9 12M52 56l-16-28M52 56l16-28"/><path d="M36 74h32"/>`+AR("M96 26v26")),
pullup:fig(DEFS+`<path d="M18 16h84"/>${H(60,40)}<path d="M60 34 44 16M60 34 76 16M60 46v18M60 64l-8 14M60 64l8 14"/>`+AR("M100 60V34")),
row_seat:fig(DEFS+`<path d="M18 40h10M18 30v20"/>${H(66,40)}<path d="M66 46v16M66 62l-14 8M66 62l10 12M66 50 30 40"/><path d="M50 72h34"/>`+AR("M44 22h26")),
row_bent:fig(DEFS+`${H(30,34)}<path d="M36 38 66 48M66 48v22M66 70l-8 12M66 70l8 12M44 42v20"/><path d="M30 62h28"/>`+AR("M44 60V40")),
pullover:fig(DEFS+`<path d="M24 68h72"/>${H(40,58)}<path d="M46 58h36M58 58 34 34"/><path d="M26 30h18"/>`+AR("M56 24A30 30 0 0 1 84 44")),
shrug:fig(DEFS+`${H(60,22)}<path d="M60 28v30M60 58l-9 22M60 58l9 22M44 32v20M76 32v20M44 32h-8M44 32h8M76 32h-8M76 32h8"/><path d="M34 50h20M66 50h20"/>`+AR("M100 46V24")),
ohp:fig(DEFS+`${H(60,50)}<path d="M60 56v14M60 70l-9 12M60 70l9 12M60 54 42 30M60 54 78 30M32 30h20M68 30h20"/>`+AR("M100 46V22")),
lateral:fig(DEFS+`${H(60,28)}<path d="M60 34v26M60 60l-8 22M60 60l8 22M60 40 30 44M60 40 90 44M22 40h16M82 40h16"/>`+AR("M24 66 18 42")+AR("M96 66l6-24")),
rear_fly:fig(DEFS+`${H(26,32)}<path d="M32 36 62 46M62 46v22M62 68l-8 12M62 68l8 12M46 42 30 22M46 42 62 22"/><path d="M22 18h14M56 18h14"/>`+AR("M84 32 62 24")),

  if(P.li!==undefined||P.hiit!==undefined){
    P.cardioPlan=cardioDetail(P.li||0,P.hiit||0,true,P.steps||9000,false);
  }else{
    const txt=String(P.cardio||"");
    const all=[...txt.matchAll(/(\d+)\s*นาที/g)].map(x=>+x[1]);
    const hasH=/HIIT/.test(txt);
    let li=0,hi=0;
    if(hasH&&all.length>1){li=all[0];hi=all[1]}
    else if(hasH){hi=all[0]||0}
    else {li=all[0]||0}
    P.cardioPlan=cardioDetail(li,hi,true,P.steps||9000,easy);
  }
  return P;
}
function exList(P){
  let e=P.session?P.session.e.slice():[];
  if(P.vol!==undefined&&P.vol<1) e=e.map(x=>[x[0],Math.max(1,Math.round(x[1]*P.vol)),x[2],x[3],x[4],x[5]]);
  if(P.abs) e=e.concat(ABS[P.abs].map(a=>[a[0],+a[1],a[2],"0–1",45,a[3]]));
  return e;
}

const cache={};
const blank=()=>({meals:{},cardio:0,abs:0,water:0,steps:0,note:"",sleep:null,lift:{}});
async function rec(ds){
  if(cache[ds])return cache[ds];
  let r=await sGet("pt:d:"+ds);
  if(!r){
    const a=await sGet("pt:day:"+ds), b=await sGet("pt:lift:"+ds);   // ย้ายข้อมูลเวอร์ชันเก่า
    r=blank();
    if(a){r.meals=a.meals||{};r.cardio=a.cardio||0;r.abs=a.abs||0;r.water=a.water||0;r.steps=a.steps||0}
    if(b)r.lift=b;
    if(a||b){await sSet("pt:d:"+ds,r);await touchIdx(ds)}
  }
  if(!r.lift)r.lift={};
  if(!r.meals)r.meals={};
  cache[ds]=r; return r;
}
async function save(ds){ await sSet("pt:d:"+ds,cache[ds]); await touchIdx(ds) }
async function getDay(ds){ return await rec(ds) }

async function idxLift(ds,lf){
  const x=await getIdx(), ex=exList(plan(ds)); let ch=false;

}

function mealSlots(){
  const g=(SET&&SET.gym)||1140;

}

const PREV={};
async function buildPrev(){
  Object.keys(PREV).forEach(k=>delete PREV[k]);
  for(let k=1;k<=21;k++){
    const ds=add(BROWSE,-k); if(ds<D0)break;
    const P=plan(ds),ex=exList(P); if(!ex.length)continue;
    const lf=await getLift(ds);
    ex.forEach((x,i)=>{const s=lf[i];if(s&&s.length&&!PREV[x[0]])PREV[x[0]]=s.map(v=>`${v.w??"?"}×${v.r??"?"}`).join("  ")});
  }
}

  const it={m:i,n:n||"รายการเพิ่มเอง",kcal:k,p:g("fp"),c:g("fc"),f:g("ff")};
  L.food=L.food||[]; L.food.push(it);

async function delFood(idx){
  const L=await getDay(TODAY); if(!L.food||!L.food[idx])return;
  const mi=L.food[idx].m; L.food.splice(idx,1);

  await putDay(TODAY,L); vEat();
}

/* ---------- สรุปรายสัปดาห์ ---------- */
async function weekBox(){
  const dow=(day(TODAY).getDay()+6)%7, mon=add(TODAY,-dow);
  let tD=0,tP=0,wat=0,watN=0,cD=0,cP=0,cN=0,delt=0,absD=0,absP=0,absN=0,slp=[],mealD=0,mealN=0,mealT=0,wDays=0,elapsed=0;
  for(let i=0;i<7;i++){
    const ds=add(mon,i); if(ds<D0||ds>DEND||ds>TODAY)continue;
    elapsed++;
    const P=plan(ds), ex=exList(P), r=await rec(ds);
    const hasLift=Object.keys(r.lift).some(k=>(r.lift[k]||[]).length);
    if(P.session){tP++; if(hasLift)tD++}
    const touched=hasLift||r.cardio||r.abs||r.water||r.steps||Object.keys(r.meals).length;
    if(r.water)watN++; if(r.water>=P.water)wat++;
    const ct=cardioTotal(P);
    if(ct){cP+=ct; const dm=(typeof r.cardio==="number"&&r.cardio>1)?r.cardio:(r.cardio?ct:0); if(dm||touched)cN++; cD+=Math.min(ct,dm)}
    if(P.abs){absP++; if(touched)absN++; if(r.abs)absD++}
    if((r.food||[]).length){mealN++; mealD+=foodSum(r).kcal; mealT+=P.kcal[0]}
    if(r.sleep)slp.push(r.sleep);
    ex.forEach((e,j)=>{ if(/lateral raise|y-raise|upright row/i.test(e[0])) delt+=(r.lift[j]||[]).length });
  }
  const wt=await getWT(), k=Object.keys(wt).sort();
  const inW=k.filter(x=>x>=mon&&x<=TODAY), inP=k.filter(x=>x>=add(mon,-7)&&x<mon);
  wDays=inW.length;
  const av=a=>a.length?a.reduce((s,x)=>s+wt[x],0)/a.length:null;
  const a=av(inW), b=av(inP), dw=(a&&b)?a-b:null;
  const P0=plan(TODAY), deltTarget=P0.phase===4?12:20;
  const slpAvg=slp.length?(slp.reduce((s,x)=>s+x,0)/slp.length):null;

  const opt=(v,t,n,lab,en)=>{
    if(!n)return `<div style="margin:11px 0"><div style="display:flex;justify-content:space-between;font-size:12.5px">
      <span style="color:var(--ink2)">${lab} <span style="font-size:10.5px;color:var(--ink3)">${en}</span></span>
      <span class="miss">ไม่ได้กรอก · no data</span></div></div>`;
    const pct=Math.min(100,t?v/t*100:0), col=pct>=90?"var(--moss)":(pct>=60?"var(--gold)":"var(--brick)");
    return `<div style="margin:11px 0"><div style="display:flex;justify-content:space-between;font-size:12.5px;margin-bottom:5px">
      <span style="color:var(--ink2)">${lab} <span style="font-size:10.5px;color:var(--ink3)">${en}</span></span><b class="num">${v} / ${t}</b></div>
      <div class="mbar"><i style="width:${pct}%;background:${col}"></i></div></div>`;
  };

  let h=`<h2>สัปดาห์นี้<span class="en">This week · ${fmt(mon)} – ${fmt(add(mon,6))}</span></h2>`;

  /* ตัวชี้วัดหลัก — มาจาก 2 อย่างที่ต้องกรอกเท่านั้น */
  h+=`<div class="two">
    <div class="mini"><span>น้ำหนักเฉลี่ย · Avg weight</span>
      <b style="color:${a?"var(--red)":"var(--ink3)"}">${a?a.toFixed(1):"—"}</b>
      <div style="font-size:11.5px;margin-top:4px;color:${dw==null?"var(--ink3)":(dw<-0.6?"var(--brick)":(dw<0?"var(--moss)":"var(--ink2)"))}">
        ${dw==null?(wDays?"ยังเทียบไม่ได้ ต้องมี 2 สัปดาห์":"ยังไม่ได้ชั่งสัปดาห์นี้"):(dw>0?"+":"")+dw.toFixed(2)+" kg จากสัปดาห์ก่อน"}</div>
      <div style="font-size:11px;margin-top:3px;color:var(--ink3)">ชั่งแล้ว ${wDays}/${elapsed} วัน</div></div>
    <div class="mini"><span>วันเล่นเวท · Sessions</span>
      <b style="color:${tP&&tD>=tP?"var(--moss)":"var(--ink)"}">${tD}<span style="display:inline;font-size:15px;color:var(--ink3)">/${tP}</span></b>
      <div style="font-size:11.5px;margin-top:4px;color:${delt>=deltTarget?"var(--moss)":"var(--ink2)"}">เซ็ตไหล่ข้าง ${delt}/${deltTarget}</div>
      <div style="font-size:11px;margin-top:3px;color:var(--ink3)">Side delt sets</div></div>
  </div>`;

  if(!wDays&&!tD){
    h+=`<div class="dataq">ยังไม่มีข้อมูลสัปดาห์นี้ — รายงานสร้างจาก <b>น้ำหนักตอนเช้า</b> กับ <b>น้ำหนักที่ยกได้</b> ถ้าไม่กรอก 2 อย่างนี้ แอปจะวัดผลให้ไม่ได้เลย<br><span style="font-size:11.5px">The report is built from your weigh-ins and lift logs. Without them there is nothing to measure.</span></div>`;
  }else if(wDays<3){
    h+=`<div class="dataq">ชั่งน้ำหนักแค่ ${wDays} วัน — ค่าเฉลี่ยยังเชื่อถือไม่ได้ ควรชั่งอย่างน้อย 4–5 วัน/สัปดาห์ เพราะน้ำหนักแกว่งวันต่อวันจากน้ำและอาหารในท้อง<br><span style="font-size:11.5px">Weigh in at least 4–5 days a week — daily weight swings too much to read a single day.</span></div>`;
  }
  if(dw!=null&&dw<-0.6)h+=`<div class="note">ลดเร็วเกินเพดาน 0.6 kg/สัปดาห์ — เพิ่มแคลอรี่กลับ 150–200 (กรดยูริก 7.7 ห้ามลดเร็ว)<br><span style="font-size:11.5px">Losing faster than the 0.6 kg/week ceiling — add 150–200 kcal back.</span></div>`;
  if(delt<deltTarget*0.8&&tD>=3)h+=`<div class="note">เซ็ตไหล่ข้างต่ำกว่าเป้า — กล้ามเนื้อนี้เปลี่ยนรูปร่างคุณมากที่สุด<br><span style="font-size:11.5px">Side delt volume below target — your highest-ROI muscle.</span></div>`;

  h+=`<details><summary>ข้อมูลเสริม · Optional tracking</summary><div class="card">
    <div style="font-size:12.5px;color:var(--ink2);margin-bottom:6px">ไม่ได้กรอกก็ไม่ผิด — ส่วนนี้ไม่ได้ใช้ตัดสินใจอะไร แค่ช่วยหาสาเหตุตอนผลไม่เป็นไปตามแผน<br>
      <span style="font-size:11px;color:var(--ink3)">Optional. Skipping these does not affect the program.</span></div>
    ${opt(cD,cP,cN,"คาร์ดิโอ (นาที)","Cardio minutes")}
    ${opt(absD,absP,absN,"หน้าท้อง","Abs")}
    ${opt(wat,elapsed,watN,"วันที่ดื่มน้ำครบ","Water")}
    ${opt(mealD,mealT,mealN,"แคลอรี่ที่บันทึก","Calories logged")}
    <div class="stats" style="margin-top:12px">
      <div><b style="color:${slpAvg?(slpAvg<6?"var(--brick)":"var(--ink)"):"var(--ink3)"}">${slpAvg?slpAvg.toFixed(1):"—"}</b><span>นอนเฉลี่ย ชม. · Sleep</span></div>
      <div><b>${slp.length}</b><span>วันที่บันทึก · logged</span></div></div>
  </div></details>`;
  return h;
}

let EXSEL=null;
async function strengthBox(){
  const x=await getIdx(), names=Object.keys(x.ex).filter(n=>Object.keys(x.ex[n]).length>=2)
    .sort((a,b)=>Object.keys(x.ex[b]).length-Object.keys(x.ex[a]).length);
  if(!names.length)return `<h2>แรงที่ยกได้</h2><div class="card"><div class="empty">บันทึกน้ำหนักและจำนวนครั้งอย่างน้อย 2 ครั้งในท่าเดียวกัน แล้วกราฟจะขึ้นที่นี่</div></div>`;
  if(!EXSEL||!x.ex[EXSEL])EXSEL=names[0];
  const D=x.ex[EXSEL], ks=Object.keys(D).sort(), v=ks.map(d=>D[d]);
  const lo=Math.min(...v)*0.94, hi=Math.max(...v)*1.06, WD=600,HT=150,pd=22;
  const X=i=>pd+(ks.length<2?0:i/(ks.length-1))*(WD-pd*2);
  const Y=n=>HT-pd-(n-lo)/((hi-lo)||1)*(HT-pd*2);
  const line=ks.map((d,i)=>(i?"L":"M")+X(i).toFixed(1)+","+Y(D[d]).toFixed(1)).join(" ");
  const first=v[0], last=v[v.length-1], ch=(last-first)/first*100;
  return `<h2>แรงที่ยกได้<span class="en">Estimated 1RM trend</span></h2><div class="card">
    <select id="exSel" style="width:100%;border:1px solid var(--line);background:var(--s2);border-radius:10px;padding:11px;color:var(--ink);font-family:inherit;font-size:14px">
      ${names.map(n=>`<option value="${n.replace(/"/g,"&quot;")}"${n===EXSEL?" selected":""}>${n}</option>`).join("")}</select>
    <svg viewBox="0 0 ${WD} ${HT}" preserveAspectRatio="none" style="width:100%;height:150px;display:block;margin-top:10px">
      <path d="${line}" fill="none" stroke="#C85F35" stroke-width="2.2"/>
      ${ks.map((d,i)=>`<circle cx="${X(i).toFixed(1)}" cy="${Y(D[d]).toFixed(1)}" r="3" fill="#C85F35"/>`).join("")}
      <text x="6" y="14" font-size="11" fill="#94A0B4" font-family="monospace">${hi.toFixed(0)}</text>
      <text x="6" y="${HT-4}" font-size="11" fill="#94A0B4" font-family="monospace">${lo.toFixed(0)}</text></svg>
    <div class="stats" style="margin-top:10px">
      <div><b>${first.toFixed(1)}</b><span>ครั้งแรก kg</span></div>
      <div class="hi"><b>${last.toFixed(1)}</b><span>ล่าสุด kg</span></div>
      <div><b style="color:${ch<-10?"var(--brick)":(ch>0?"var(--moss)":"var(--ink)")}">${ch>0?"+":""}${ch.toFixed(1)}%</b><span>เปลี่ยนแปลง</span></div>
    </div>
    ${ch<-10?`<div class="note" style="margin-top:12px">แรงตกเกิน 10% — ตามกฎที่ตั้งไว้ ให้เพิ่มแคลอรี่กลับ 150–200 ทันที และเช็กว่าโปรตีนกับการนอนพอไหม</div>`:""}
    <div style="font-size:12px;color:var(--ink3);margin-top:9px">คำนวณจากเซ็ตที่ดีที่สุดของแต่ละวัน (Epley) · ตัวเลขนี้ใช้ดูแนวโน้ม ไม่ใช่ให้ไปลองยกจริง</div></div>`;
}

function nearest(wt,ds){let best=null,bd=9e9;for(const k in wt){const d=Math.abs(diff(k,ds));if(d<bd&&d<=4){bd=d;best=wt[k]}}return best}
function mzRatio(mz){
  const k=Object.keys(mz).sort(); if(!k.length)return "";
  const l=mz[k[k.length-1]]; if(!l||!l.sh||!l.wa)return "";
  return `<div class="stats" style="margin-top:12px"><div class="hi"><b>${(l.sh/l.wa).toFixed(2)}</b><span>ไหล่ ÷ เอว · V-taper</span></div>
    <div><b>1.55–1.60</b><span>เป้าหมาย</span></div>${l.ar&&l.al?`<div><b>${Math.abs(l.ar-l.al).toFixed(1)}</b><span>ต่างซ้าย-ขวา cm</span></div>`:""}</div>`;
}
function chart(wt){
  const k=Object.keys(wt).sort();
  if(k.length<2)return `<div class="card"><div class="empty">ชั่งอย่างน้อย 2 วันเพื่อดูกราฟแนวโน้ม</div></div>`;
  const WD=600,HT=180,pd=24;
  const x0=diff(D0,k[0]),x1=Math.max(diff(D0,k[k.length-1]),diff(D0,"2027-04-13"));
  const vals=k.map(d=>wt[d]),lo=Math.min(66,...vals)-1,hi=Math.max(...vals)+1;
  const X=ds=>pd+(diff(D0,ds)-x0)/(x1-x0||1)*(WD-pd*2);
  const Y=v=>HT-pd-(v-lo)/(hi-lo||1)*(HT-pd*2);
  const line=k.map((d,i)=>(i?"L":"M")+X(d).toFixed(1)+","+Y(wt[d]).toFixed(1)).join(" ");
  const area=line+` L${X(k[k.length-1]).toFixed(1)},${HT-pd} L${X(k[0]).toFixed(1)},${HT-pd} Z`;
  const tgt=CHECK.map(c=>[c[1],c[2]]).filter(c=>c[0]>=k[0]);
  const tline=[[k[0],wt[k[0]]]].concat(tgt).map((c,i)=>(i?"L":"M")+X(c[0]).toFixed(1)+","+Y(c[1]).toFixed(1)).join(" ");
  return `<div class="card" style="padding:12px 4px 8px"><svg class="chart" viewBox="0 0 ${WD} ${HT}" preserveAspectRatio="none">
    <defs><linearGradient id="gg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#C85F35" stop-opacity=".18"/><stop offset="1" stop-color="#C85F35" stop-opacity="0"/></linearGradient></defs>
    <path d="${area}" fill="url(#gg)" stroke="none"/>
    <path d="${tline}" fill="none" stroke="#5F7F4F" stroke-width="1.4" stroke-dasharray="5 5"/>
    <path d="${line}" fill="none" stroke="#C85F35" stroke-width="2.2"/>
    ${k.slice(-1).map(d=>`<circle cx="${X(d).toFixed(1)}" cy="${Y(wt[d]).toFixed(1)}" r="4" fill="#C85F35"/>`).join("")}
    <text x="6" y="14" font-size="11" fill="#94A0B4" font-family="monospace">${hi.toFixed(0)}</text>
    <text x="6" y="${HT-4}" font-size="11" fill="#94A0B4" font-family="monospace">${lo.toFixed(0)}</text></svg>
    <div style="padding:6px 12px 0;font-size:12px;color:var(--ink3)">เส้นทอง = น้ำหนักจริง · เส้นประฟ้า = เส้นทางที่วางไว้</div></div>`;
}

    <tr class="hit"><td class="l">eGFR</td><td class="num">116</td><td class="num" style="color:var(--moss)">&gt;90</td></tr>
    <tr class="hit"><td class="l">FBS</td><td class="num">92</td><td class="num" style="color:var(--moss)">70–110</td></tr></table>
    <div style="font-size:12.5px;color:var(--ink2);margin-top:12px;line-height:1.65">Chol÷HDL = 3.6 · TG÷HDL = 2.2 — อัตราส่วนยังอยู่ในเกณฑ์ดี ตับและไตดีเยี่ยม<br>
    เจาะซ้ำที่สัปดาห์ 20 (ต้นเดือน ก.พ. 2027) ขอเพิ่ม วิตามินดี · ฮอร์โมนเพศชาย · TSH · HbA1c · CBC<br>
    ครีเอทีนดันค่า Creatinine ขึ้นเล็กน้อยโดยไม่ได้แปลว่าไตแย่ — บอกแพทย์ทุกครั้ง หรือหยุด 2 สัปดาห์ก่อนเจาะ</div></div>
    <div class="note" style="margin-top:11px">MonsterGoldX เป็นเครื่องมือช่วยจดบันทึก ไม่ใช่คำแนะนำทางการแพทย์ — เอาผลเลือดไปคุยกับแพทย์ก่อนเริ่ม และหยุดทันทีถ้ามีอาการผิดปกติ</div>`;

  const gym=(SET&&SET.gym)||1140;
  h+=`<h2>ตั้งค่า<span class="en">Settings</span></h2><div class="card">
    <label style="font-size:12.5px;color:var(--ink2);display:block;margin-bottom:7px">เวลาเข้ายิม — เวลามื้อก่อนเล่น หลังเล่น และมื้อเย็นจะเลื่อนตาม</label>
    <select id="gymSel" style="width:100%;border:1px solid var(--line);background:var(--s2);border-radius:10px;padding:12px;color:var(--ink);font-family:inherit;font-size:15px">
      ${[360,420,600,660,960,1020,1080,1140,1200].map(v=>`<option value="${v}"${v===gym?" selected":""}>${String(Math.floor(v/60)).padStart(2,"0")}:${String(v%60).padStart(2,"0")} น.</option>`).join("")}
    </select>
    <div style="font-size:12px;color:var(--ink3);margin-top:9px">ก่อนเล่น ${hhmm(mealSlots().pre)} · หลังเล่น ${hhmm(mealSlots().post)} · มื้อเย็น ${hhmm(mealSlots().din)}</div></div>`;

  h+=`<div class="card" style="margin-top:11px"><div style="font-size:13px;color:var(--ink2);line-height:1.6">ตั้งค่าเส้นฐาน — ชั่ง วัดรอบตัว ถ่ายรูป และยืนยันว่าคุยกับแพทย์เรื่องผลเลือดแล้ว</div>
    <button class="go ghost" style="margin-top:11px" onclick="reOnboard()">เปิดหน้าตั้งค่าเริ่มต้น · Baseline setup</button></div>`;
  h+=`<h2>สำรองข้อมูล<span class="en">Backup & restore</span></h2><div class="card">
    <div style="font-size:13px;color:var(--ink2);line-height:1.6">ข้อมูลทั้งหมดเก็บอยู่ในแอปนี้ที่เดียว ไม่มีสำรองอัตโนมัติ — <b style="color:var(--gold)">ส่งออกเก็บไว้ทุกเดือน</b> แล้วเซฟไฟล์ไว้ในมือถือหรือส่งเข้าอีเมลตัวเอง</div>
    <div style="display:flex;gap:8px;margin-top:11px">
      <button class="go" onclick="doExport()" style="flex:1">ส่งออก · Export</button>
      <button class="go ghost" onclick="doImport()" style="flex:1">นำเข้า · Import</button>
    </div>
    <textarea id="ioBox" rows="4" placeholder="กดส่งออกแล้วข้อความสำรองจะขึ้นตรงนี้ให้คัดลอกเก็บไว้ · จะกู้คืนก็วางข้อความกลับมาแล้วกดนำเข้า"
      style="width:100%;margin-top:10px;border:1px solid var(--line);background:var(--s2);border-radius:10px;padding:11px;font-family:var(--mono);font-size:11px;color:var(--ink2);resize:vertical"></textarea>
    <div style="font-size:12px;color:var(--ink3);margin-top:8px">นำเข้าจะเขียนทับเฉพาะวันที่มีในไฟล์ วันอื่นไม่ถูกแตะ</div></div>`;
  document.getElementById("v-plan").innerHTML=h;
}

/* ---------- เหตุการณ์ ---------- */
async function render(){
  await getSet();
  renderHeader();
  document.querySelectorAll(".view").forEach(v=>v.classList.remove("on"));
  document.getElementById("v-"+VIEW).classList.add("on");
  document.querySelectorAll("nav button").forEach(b=>b.classList.toggle("on",b.dataset.v===VIEW));
  if(VIEW==="today"){ if(!(SET&&SET.onboarded))await vOnboard(); else await vToday(); }
  if(VIEW==="lift"){await buildPrev();await vLift()}
  if(VIEW==="eat")await vEat();
  if(VIEW==="weigh")await vWeigh();
  if(VIEW==="plan")vPlan();
  if(window.scrollTo)window.scrollTo(0,0);
}
document.querySelector("nav").addEventListener("click",e=>{
  const b=e.target.closest("button"); if(!b)return;
  VIEW=b.dataset.v; render();
});
document.addEventListener("click",async e=>{
  const ob=e.target.closest("[data-ob]");
  if(ob){await obAct(ob.dataset.ob);return}
  const g=e.target.closest("[data-goto]");
  if(g){VIEW=g.dataset.goto;BROWSE=TODAY;render();return}
  const tg=e.target.closest("[data-tg]");
  if(tg){const L=await getDay(TODAY);L[tg.dataset.tg]=L[tg.dataset.tg]?0:1;await putDay(TODAY,L);
    if(VIEW==="lift")vLift(); else vToday(); return}
  const qw=e.target.closest("[data-qw]");
  if(qw){const P=plan(TODAY),L=await getDay(TODAY);
    L.water=L.water>=P.water?0:L.water+1; await putDay(TODAY,L);
    toast(L.water>=P.water?"น้ำครบแล้ววันนี้":"น้ำ "+(L.water*.5).toFixed(1)+" ลิตร"); vToday(); return}
  const w=e.target.closest("[data-w]");
  if(w){const L=await getDay(TODAY);const n=+w.dataset.w;L.water=(L.water===n)?n-1:n;await putDay(TODAY,L);vToday();return}
  const fp=e.target.closest("[data-fplan]");
  if(fp){await logPlanned(+fp.dataset.fplan);return}
  const fa=e.target.closest("[data-fadd]");
  if(fa){const i=+fa.dataset.fadd; OPENM=(OPENM===i)?null:i; vEat(); return}
  const fsv=e.target.closest("[data-fsave]");
  if(fsv){await saveFood(+fsv.dataset.fsave);return}
  const fv=e.target.closest("[data-fav]");
  if(fv){const a=fv.dataset.fav.split(".");await addFav(+a[0],+a[1]);return}
  const fd=e.target.closest("[data-fdel]");
  if(fd){await delFood(+fd.dataset.fdel);return}
  const ad=e.target.closest("[data-add]");
  if(ad){const i=ad.dataset.add,lf=await getLift(BROWSE);lf[i]=lf[i]||[];
    const p=lf[i][lf[i].length-1];lf[i].push({w:p?p.w:null,r:null});await putLift(BROWSE,lf);
    startTimer(+ad.dataset.rest);await vLift();
    const ins=document.querySelectorAll(`input[data-e="${i}"][data-k="r"]`);if(ins.length)ins[ins.length-1].focus();return}
  const rm=e.target.closest("[data-rm]");
  if(rm){const p=rm.dataset.rm.split("."),lf=await getLift(BROWSE);lf[p[0]].splice(+p[1],1);
    if(!lf[p[0]].length)delete lf[p[0]];await putLift(BROWSE,lf);vLift();return}
  const t=e.target.closest("[data-t]");
  if(t){startTimer(+t.dataset.t);return}
  const dn=e.target.closest("[data-d]");
  if(dn){BROWSE=add(BROWSE,+dn.dataset.d);if(BROWSE<D0)BROWSE=D0;if(BROWSE>DEND)BROWSE=DEND;
    if(VIEW==="lift"){await buildPrev();vLift()}else vPlan();return}
});
document.addEventListener("change",async e=>{
  if(e.target.id==="exSel"){ EXSEL=e.target.value; vWeigh(); return }
  if(e.target.id==="gymSel"){ const st=await getSet(); st.gym=+e.target.value; SET=st;
    await sSet("pt:settings",st); toast("ปรับเวลามื้ออาหารแล้ว"); vPlan(); return }
  const inp=e.target.closest("input[data-e]"); if(!inp)return;
  const lf=await getLift(BROWSE),i=inp.dataset.e,j=+inp.dataset.s;
  if(!lf[i]||!lf[i][j])return;
  lf[i][j][inp.dataset.k]=inp.value===""?null:+inp.value;
  await putLift(BROWSE,lf); toast();
});
async function saveWeight(second){
  const el=document.getElementById(second?"wIn2":"wIn"),v=parseFloat(el.value);
  if(!v||v<40||v>160){toast("ใส่น้ำหนักเป็นตัวเลข kg");return}
  const wt=await getWT(); wt[TODAY]=v; WT=wt; await sSet("pt:weight",wt);
  toast("บันทึก "+v.toFixed(1)+" kg"); render();
}
async function saveMz(pfx){
  const q=pfx||"mz_";
  const mz=await getMZ(),g=id=>{const e=document.getElementById(q+id);const v=e?parseFloat(e.value):NaN;return isNaN(v)?null:v};
  const o={sh:g("sh"),wa:g("wa"),ar:g("ar"),al:g("al"),bf:g("bf"),sm:g("sm")};
  if(!Object.values(o).some(v=>v!==null)){toast("ยังไม่ได้กรอกค่าวัด");return}
  mz[TODAY]=o; MZ=mz; await sSet("pt:measure",mz); toast("บันทึกการวัดแล้ว");
  if(!pfx)vWeigh();
}
async function saveNote(){
  const r=await rec(TODAY);
  const sl=parseFloat(document.getElementById("slIn").value);
  r.sleep=isNaN(sl)?null:sl;
  r.note=document.getElementById("ntIn").value.slice(0,600);
  cache[TODAY]=r; await save(TODAY);
  toast(r.sleep&&r.sleep<6?"บันทึกแล้ว — นอนน้อยไปนะ":"บันทึกโน้ตแล้ว");
}
async function doExport(){
  toast("กำลังรวบรวมข้อมูล…");
  const x=await getIdx();
  const out={app:"MonsterGoldX",v:1,made:new Date().toISOString(),
    weight:await getWT(),measure:await getMZ(),settings:await getSet(),foods:await getFoods(),days:{}};
  for(const ds of x.d){ out.days[ds]=await rec(ds) }
  const txt=JSON.stringify(out);
  try{ const b=new Blob([txt],{type:"application/json"});
    const a=document.createElement("a"); a.href=URL.createObjectURL(b);
    a.download="MonsterGoldX-"+TODAY+".json"; document.body.appendChild(a); a.click(); a.remove();
  }catch(e){}
  const box=document.getElementById("ioBox"); if(box){box.value=txt;box.focus();box.select()}
  toast("ส่งออก "+x.d.length+" วันแล้ว");
}
async function doImport(){
  const box=document.getElementById("ioBox"); let o;
  try{ o=JSON.parse(box.value) }catch(e){ toast("ข้อความสำรองไม่ถูกต้อง"); return }
  if(!o||!o.days){ toast("ข้อความสำรองไม่ถูกต้อง"); return }
  toast("กำลังนำเข้า…");
  const x=await getIdx();
  for(const ds in o.days){
    const r=Object.assign(blank(),o.days[ds]);
    cache[ds]=r; await sSet("pt:d:"+ds,r);
    if(!x.d.includes(ds))x.d.push(ds);
    await idxLift(ds,r.lift||{});
  }
  x.d.sort(); IDX=x; await sSet("pt:idx",x);
  if(o.weight){ WT=o.weight; await sSet("pt:weight",WT) }
  if(o.measure){ MZ=o.measure; await sSet("pt:measure",MZ) }
  if(o.settings){ SET=o.settings; await sSet("pt:settings",SET) }
  if(o.foods){ FOODS=o.foods; await sSet("pt:foods",FOODS) }
  toast("นำเข้า "+Object.keys(o.days).length+" วันแล้ว");
  render();
}
async function reOnboard(){ const st=await getSet(); st.onboarded=0; SET=st; await sSet("pt:settings",st); VIEW="today"; render() }
let tmI=null,tmEnd=0,tmTot=0;
function startTimer(sec){ if(!sec)return; stopTimer(); tmTot=sec; tmEnd=Date.now()+sec*1000;
  document.getElementById("timer").classList.add("on"); tick(); tmI=setInterval(tick,200) }
function tick(){
  const left=Math.max(0,tmEnd-Date.now()),s=Math.ceil(left/1000);
  document.getElementById("tmN").textContent=String(Math.floor(s/60)).padStart(2,"0")+":"+String(s%60).padStart(2,"0");
  document.getElementById("tmP").style.width=(left/(tmTot*1000)*100)+"%";
  if(left<=0){stopTimer();if(navigator.vibrate)navigator.vibrate([120,80,120]);toast("หมดเวลาพัก — เซ็ตต่อไป")}
}
function stopTimer(){ clearInterval(tmI); tmI=null; document.getElementById("timer").classList.remove("on") }
render();
if("serviceWorker" in navigator){
  window.addEventListener("load",()=>{
    navigator.serviceWorker.register("sw.js").catch(()=>{});
  });
}
</script>
